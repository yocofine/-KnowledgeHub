map $http_upgrade $edu_weknora_connection {
    default upgrade;
    '' close;
}
map $uri $edu_weknora_log_uri {
    ~^/r/ /r/redacted;
    ~^/mcp/ /mcp/redacted;
    default $uri;
}
log_format edu_weknora '$remote_addr [$time_local] "$request_method $edu_weknora_log_uri $server_protocol" $status $body_bytes_sent';

server {
    listen 80;
    server_name edu-rag.jishang20.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name edu-rag.jishang20.com;
    ssl_certificate /etc/nginx/ssl/jishang20.com.pem;
    ssl_certificate_key /etc/nginx/ssl/jishang20.com.key;
    client_max_body_size 100M;
    access_log /var/log/nginx/edu-weknora-access.log edu_weknora;
    location / {
        proxy_pass http://127.0.0.1:18081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $edu_weknora_connection;
        proxy_connect_timeout 15s;
        proxy_send_timeout 600s;
        proxy_read_timeout 3600s;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
